services:

  backend:
    image: shopverse-backend:${BACKEND_VERSION:-latest}
    environment:
      PORT: 5000
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: shopverse
      DB_PASSWORD: shopverse123
      DB_NAME: shopverse_db
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: shopverse-frontend:${FRONTEND_VERSION:-latest}
    ports:
      - "8181:80"
    depends_on:
      - backend
    restart: unless-stopped

  database:
    image: mysql:8.4
    container_name: shopverse-database
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: shopverse_db
      MYSQL_USER: shopverse
      MYSQL_PASSWORD: shopverse123
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "shopverse",
          "-pshopverse123"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data:
